services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: liberloci
      POSTGRES_PASSWORD: liberloci
      POSTGRES_DB: liberloci
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liberloci"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
    environment:
      DATABASE_URL: postgresql://liberloci:liberloci@db:5432/liberloci
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
